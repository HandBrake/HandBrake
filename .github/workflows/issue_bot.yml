name: IssueBot

on:
  issues:
    types:
      - opened

permissions:
  issues: write
  pull-requests: write
  
jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v3
        with:
          issue_message: |-
            Hello, and welcome to the HandBrake repository.

            Please complete the issue template. For bug reports, include steps to reproduce the problem and an activity log where relevant. For feature requests, explain the proposed feature and the problem it would solve.

            > [!WARNING]
            > Be cautious of replies asking you to download DLLs or other files from third-party websites, particularly from users who are not members of the HandBrake team. These downloads may be malicious.
            > HandBrake team members have a “Member” label beside their comments.

            > [!TIP]
            > See the [HandBrake documentation](https://handbrake.fr/docs) for guidance and troubleshooting.

            Please follow our [Code of Conduct](https://github.com/HandBrake/HandBrake/blob/master/CODE_OF_CONDUCT.md).

            Thank you,
            The HandBrake Bot
          pr_message: |
            Hello, and welcome to the HandBrake repository.

            This is an automated message from the HandBrake Bot.

            Thank you for your submission. Maintainer availability is limited. You can help us by completing all sections of the pull request template and providing relevant details about your changes and testing.

            > [!TIP]
            > Please read the [contributing guide](https://handbrake.fr/docs/en/latest/contributing/contribute.html) and follow the [Code of Conduct](https://github.com/HandBrake/HandBrake/blob/master/CODE_OF_CONDUCT.md).

            Thank you,
            The HandBrake Bot
